                        b1_1: "ただテストの点数を上げるだけでなく、生徒が将来社会で活躍できるように、学ぶ楽しさや正しいマナーを教えることだと思います。また、夜遅くに帰宅する生徒の安全を守ることも、学習塾の大切な責任です。",
                        b1_2: "法律やルールをきちんと守って、保護者や生徒に誠実で質の高い教育サービスを提供することだと思います。また、ペーパーレス化を進めて紙のごみを減らすなど、環境を守る取り組みも大切だと思います。",
                        b2_1: "{法令遵守（コンプライアンス）|ほうれいじゅんしゅ}と安全管理を徹底した上で、教育を通じて次世代を担う子どもたちの可能性を広げ、地域社会の発展に寄与することです。単なる営利追求にとどまらず、学習機会の提供や質の高い教育によって社会的価値を創出する姿勢が求められております。",
                        b2_2: "{生徒・保護者・従業員・地域社会|せいと・ほごしゃ・じゅうぎょういん・ちいきしゃかい}といったすべてのステークホルダーに対して誠実であり続けることです。経済的な事情に関わらず学べる奨学金制度の導入や、地域の防犯・環境活動への参加など、教育機関ならではの社会貢献を果たすべきだと考えます。"
                    },
                    {
                        num: "Q31（第 31 題）",
                        orig: "B1 × 2 則 ＋ B2 × 2 則",
                        q: "{情報|じょうほう}セキュリティの{面|めん}で、{社員一人|しゃいんひとり}ひとりが{気|き}をつけるべきことは{何|なん}ですか。",
                        zh: "在資訊安全（保護學生與家長個人資料）方面，每位員工應該注意什麼？",
                        b1_1: "{生徒|せいと}の名前や電話番号、テストの成績などの個人情報が書かれた書類を、机の上に置きっぱなしにしないことです。帰るときは必ず鍵のかかるロッカーにしまって、外に持ち出さないように毎日気をつけています。",
                        b1_2: "パソコンのパスワードを複雑にして他の人に教えないことや、保護者へ一斉メールを送るときにメールアドレスが他の人に見えないよう「BCC」を必ず確認することです。小さなミスが大きな問題になるので注意しています。",
                        b2_1: "「{生徒や保護者の大切な個人情報|せいとやほごしゃのたいせつなこじんじょうほう}を預かっている」という強い当事者意識を持つことです。成績データや面談記録へのアクセス制限の遵守、誤送信防止のダブルチェック、不審メールへの警戒など、基本ルールを形骸化させず徹底することが重要です。",
                        b2_2: "{業務効率や利便性|ぎょうむこうりつやりべんせい}を優先するあまり、許可されていない個人のスマートフォンやクラウドサービスに生徒のデータを保存する「シャドーIT」を厳に慎むべきです。万が一情報漏洩の懸念が生じた際には、即座に教室長や管理部門へ報告し、被害を最小限に抑える行動が求められます。"
                    }
                ]
            }
        ];

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';

            categories.forEach((cat) => {
                html += `<section class="cat-section mb-12" data-cat="${cat.id}">`;
                html += `
                    <div class="cat-header bg-gradient-to-r from-indigo-600 to-indigo-500 text-white p-5 rounded-xl shadow-md mb-6 avoid-break">
                        <div class="text-xs font-bold tracking-wider uppercase opacity-90 mb-1">${cat.badge}</div>
                        <h2 class="text-xl md:text-2xl font-bold mb-1">${cat.title}</h2>
                        <p class="text-xs md:text-sm text-indigo-100">${cat.meta}</p>
                    </div>
                `;

                cat.questions.forEach(item => {
                    html += `
                        <div class="avoid-break card-border mb-6 bg-white p-5 rounded-xl shadow-md border border-gray-100">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-2 pb-2 border-b border-gray-100">
                                <span class="text-sm font-bold text-indigo-700">${item.num}</span>
                                <div class="flex items-center gap-1.5">
                                    <span class="bg-gray-100 text-gray-700 text-xs font-bold px-2.5 py-0.5 rounded-full">${item.orig}</span>
                                </div>
                            </div>

                            <h3 class="jp-question text-lg md:text-xl font-bold text-gray-900 mb-1.5">
                                ${parseRuby(item.q)}
                            </h3>
                            <p class="text-xs md:text-sm text-gray-500 mb-4">
                                💬 中文題意：${item.zh}
                            </p>

                            <div class="space-y-3">
                                <!-- B1 ① -->
                                <div class="p-3.5 bg-emerald-50/80 rounded-lg border border-emerald-100">
                                    <div class="text-xs font-bold text-emerald-800 mb-1 flex items-center">
                                        <span class="level-badge badge-b1">B1 回答 ①</span> 中級標準・自然實用型
                                    </div>
                                    <p class="jp-sentence text-gray-900">${parseRuby(item.b1_1)}</p>
                                </div>

                                <!-- B1 ② -->
                                <div class="p-3.5 bg-emerald-50/80 rounded-lg border border-emerald-100">
                                    <div class="text-xs font-bold text-emerald-800 mb-1 flex items-center">
                                        <span class="level-badge badge-b1">B1 回答 ②</span> 中級流暢・具體經驗型
                                    </div>
                                    <p class="jp-sentence text-gray-900">${parseRuby(item.b1_2)}</p>
                                </div>

                                <!-- B2 ① -->
                                <div class="p-3.5 bg-amber-50/80 rounded-lg border border-amber-100">
                                    <div class="text-xs font-bold text-amber-800 mb-1 flex items-center">
                                        <span class="level-badge badge-b2">B2 回答 ①</span> 中高級・邏輯商務得體型
                                    </div>
                                    <p class="jp-sentence text-gray-900">${parseRuby(item.b2_1)}</p>
                                </div>

                                <!-- B2 ② -->
                                <div class="p-3.5 bg-amber-50/80 rounded-lg border border-amber-100">
                                    <div class="text-xs font-bold text-amber-800 mb-1 flex items-center">
                                        <span class="level-badge badge-b2">B2 回答 ②</span> 中高級・深度洞察高分型
                                    </div>
                                    <p class="jp-sentence text-gray-900">${parseRuby(item.b2_2)}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</section>`;
            });

            container.innerHTML = html;
        }

        function filterContent() {
            const val = document.getElementById('categoryFilter').value;
            const sections = document.querySelectorAll('.cat-section');
            sections.forEach(sec => {
                if (val === 'all' || sec.getAttribute('data-cat') === val) {
                    sec.style.display = 'block';
                } else {
                    sec.style.display = 'none';
                }
            });
        }

        let rubyVisible = true;
        function toggleRuby() {
            rubyVisible = !rubyVisible;
            const rts = document.querySelectorAll('rt');
            rts.forEach(rt => {
                rt.style.display = rubyVisible ? '' : 'none';
            });
            const sentences = document.querySelectorAll('.jp-sentence, .jp-question');
            sentences.forEach(el => {
                el.style.lineHeight = rubyVisible ? '2.25' : '1.75';
            });
        }

        window.onload = renderQuestions;
    </script>
</body>
</html>
